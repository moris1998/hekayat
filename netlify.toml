# Netlify builds the site from source on every push, so an edit made in the
# admin panel becomes a live page about a minute later.
[build]
  command = "node build.js"
  publish = "."

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML must never be cached hard, or a content edit would not show up.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[build.environment]
  NODE_VERSION = "20"
