<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>لوحة تحكّم حضانة حكايات</title>
  <link rel="icon" href="../assets/favicon.png" type="image/png">
  <style>
    body{margin:0;font-family:'Tajawal',system-ui,sans-serif}
    /* A short, friendly note above the panel, since the panel's own
       buttons are in English and Sahera is not a technical user. */
    #hint{
      background:#e8117c;color:#fff;padding:14px 18px;font-size:15px;
      line-height:1.7;text-align:center;font-weight:600;
    }
    #hint b{background:rgba(255,255,255,.22);padding:2px 8px;border-radius:6px}
  </style>
</head>
<body>
  <div id="hint">
    بعد كل تعديل اضغطي <b>Publish</b> ثم <b>Publish now</b> &nbsp;·&nbsp; الموقع يتحدّث لوحده خلال دقيقة
  </div>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.1.10/dist/decap-cms.js"></script>
  <script>
    /* Send a first-time user straight to the login instead of the site root. */
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', user => {
        if (!user) {
          window.netlifyIdentity.on('login', () => { document.location.href = '/admin/'; });
        }
      });
    }
  </script>
</body>
</html>
