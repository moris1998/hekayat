<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>لوحة تحكّم حضانة حكايات</title>
  <link rel="icon" href="../assets/favicon.png" type="image/png">
  <style>
    body{margin:0;font-family:'Tajawal',system-ui,sans-serif}
    /* A short, friendly note above the panel, since the panel's own
       buttons are in English and Sahera is not a technical user. */
    #hint{
      background:#e8117c;color:#fff;padding:14px 18px;font-size:15px;
      line-height:1.7;text-align:center;font-weight:600;
    }
    #hint b{background:rgba(255,255,255,.22);padding:2px 8px;border-radius:6px}
  </style>
</head>
<body>
  <div id="hint">
    بعد كل تعديل اضغطي <b>Publish</b> ثم <b>Publish now</b> &nbsp;·&nbsp; الموقع يتحدّث لوحده خلال دقيقة
  </div>
  <!-- Auth is handled by DecapBridge (see admin/config.yml). The old
       netlify-identity-widget script is gone: Netlify Identity was
       deprecated in February 2025.
       Version must stay >= 3.8.3, which is what DecapBridge PKCE login needs. -->
  <script src="https://unpkg.com/decap-cms@^3.8.3/dist/decap-cms.js"></script>
</body>
</html>
